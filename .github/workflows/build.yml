name: Build MiniEvents Plugin

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java
        run: java --version

      - name: Verify pom.xml
        run: |
          echo "Project directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Checking pom.xml..."
          test -f pom.xml
      - name: Build with Maven
        run: mvn --batch-mode clean package

      - name: Upload plugin JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiniEvents-Plugin
          path: target/*.jar
          if-no-files-found: error
